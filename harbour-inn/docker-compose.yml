version: '3.8'

services:
  # 1. PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: harbour_inn_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: harbour_inn_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/src/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql
      - ./server/src/db/migrations/002_cleanup_function.sql:/docker-entrypoint-initdb.d/002_cleanup_function.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harbour_inn_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Sliding Window Rate Limiter
  redis:
    image: redis:7-alpine
    container_name: harbour_inn_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Mailpit (Local SMTP and Web UI for Testing Email Delivery)
  mailpit:
    image: axllent/mailpit:latest
    container_name: harbour_inn_mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI to view emails and 6-digit OTP codes
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  pgdata:
  redisdata:
